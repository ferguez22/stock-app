<div class="product-card">
    <div class="product-type">
        {{ product.category_name || 'Sin categoría' }}
    </div>

    <div class="product-icon">
        <i class="fa-solid" [ngClass]="{
            'fa-display':     (product.category_name || '').toLowerCase().includes('monitor'),
            'fa-headphones':  (product.category_name || '').toLowerCase().includes('audio'),
            'fa-keyboard':    (product.category_name || '').toLowerCase().includes('teclado'),
            'fa-computer-mouse': (product.category_name || '').toLowerCase().includes('rat'),
            'fa-cable':       (product.category_name || '').toLowerCase().includes('cable'),
            'fa-volume-high': (product.category_name || '').toLowerCase().includes('sonido'),
            'fa-microchip':   (product.category_name || '').toLowerCase().includes('memoria'),
            'fa-sd-card':     (product.category_name || '').toLowerCase().includes('sd'),
            'fa-box':         true
        }"></i>
    </div>

    <h3 class="product-name">{{ product.item }}</h3>

    <div class="product-code">
        <span class="code-label">REF:</span>
        <span class="code-value">{{ product.code || 'N/A' }}</span>
    </div>

    <div class="product-stock">
        <span class="stock-label">Stock:</span>
        <span class="stock-value badge" [ngClass]="getStockStatusClass()">
            {{ product.stock }}
        </span>
    </div>

    @if (product.updated_at) {
    <div class="product-date">
        <small>Actualizado: {{ product.updated_at | date:'dd/MM/yyyy' }}</small>
    </div>
    }

    <div class="product-actions">
        <button class="btn btn-sm btn-outline-primary action-btn" (click)="onView()">
            <i class="fas fa-eye"></i>
        </button>
        <button class="btn btn-sm btn-outline-secondary action-btn" (click)="onEdit()">
            <i class="fas fa-edit"></i>
        </button>
    </div>
</div>
